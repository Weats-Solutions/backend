version: '3.9'

services:

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: weats-gateway
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      start-period: 10s
      retries: 3
    networks:
      - weats-network

  webhooks:
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    container_name: weats-webhooks
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - weats-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: weats-dashboard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - weats-network

networks:
  weats-network:
    driver: bridge
