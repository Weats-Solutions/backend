version: '3.9'

# NOTE: Este docker-compose contém 1 replica de cada app (Gateway, Webhooks, Dashboard)
# 
# Dokploy gerencia:
#   - Load Balancing
#   - Auto-scaling (baseado em métricas: CPU, RAM, requests/sec)
#   - Health checks
#   - Restart policies
#   - Prometheus para recolher métricas
#
# Serviços externos (Dokploy):
#   - PostgreSQL Core
#   - PostgreSQL Orders
#   - Redis
#   - Nginx/Load Balancer
#   - Prometheus (optional, para métricas)

services:

  # ─────────────────────────────────────────────────────────────────
  # GATEWAY API (1 replica - Dokploy faz auto-scaling)
  # ─────────────────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: weats-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      
      # ⚠️ External Database URLs (from Dokploy)
      CORE_DB_URL: ${CORE_DB_URL}
      ORDERS_DB_URL: ${ORDERS_DB_URL}
      
      # ⚠️ External Redis (from Dokploy)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EMAIL_DB: ${REDIS_EMAIL_DB:-1}
      REDIS_IMAGES_DB: ${REDIS_IMAGES_DB:-2}
      REDIS_WEBHOOK_DB: ${REDIS_WEBHOOK_DB:-3}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-4}
      REDIS_QRCODES_DB: ${REDIS_QRCODES_DB:-5}
      REDIS_SESSION_DB: ${REDIS_SESSION_DB:-6}
      
      # Third-party APIs
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      
      # Cloudflare
      CLOUDFLARE_IMAGES_ACCOUNT_ID: ${CLOUDFLARE_IMAGES_ACCOUNT_ID}
      CLOUDFLARE_CDN_URL: ${CLOUDFLARE_CDN_URL}
      
      # Encryption
      ENCRYPTION_ALGORITHM: ${ENCRYPTION_ALGORITHM:-aes-256-ctr}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ENCRYPTION_IV: ${ENCRYPTION_IV}
      
      # App Configuration
      APP_URL: ${APP_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      EUPAGO_API_URL: ${EUPAGO_API_URL}

    networks:
      - weats-network
    ports:
      - "4000:4000"  # Debug port (Dokploy gerencia production)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      start-period: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # WEBHOOKS PROCESSOR (Bull Queue Worker - NO EXTERNAL PORT)
  # 1 replica - Dokploy faz auto-scaling conforme fila cresce
  # ─────────────────────────────────────────────────────────────────

  webhooks:
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    container_name: weats-webhooks
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      
      # ⚠️ External Database (from Dokploy)
      CORE_DB_URL: ${CORE_DB_URL}
      
      # ⚠️ External Redis (from Dokploy)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_WEBHOOK_DB: ${REDIS_WEBHOOK_DB:-3}
      
      # Third-party APIs
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      
      # Encryption
      ENCRYPTION_ALGORITHM: ${ENCRYPTION_ALGORITHM:-aes-256-ctr}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ENCRYPTION_IV: ${ENCRYPTION_IV}
      
      # Discord
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

    networks:
      - weats-network
    # ⚠️ NO PORT EXPOSED - Uses internal Redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────
  # DASHBOARD MICROSERVICE (TCP Communication)
  # 1 replica - Dokploy faz auto-scaling conforme necessário
  # ─────────────────────────────────────────────────────────────────

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: weats-dashboard
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DASHBOARD_PORT: 3002
      
      # ⚠️ External Database (from Dokploy)
      CORE_DB_URL: ${CORE_DB_URL}
      
      # ⚠️ External Redis (from Dokploy)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-4}
      
      # Encryption
      ENCRYPTION_ALGORITHM: ${ENCRYPTION_ALGORITHM:-aes-256-ctr}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ENCRYPTION_IV: ${ENCRYPTION_IV}

    networks:
      - weats-network
    # ⚠️ Internal only - TCP communication with Gateway
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────────

networks:
  weats-network:
    driver: bridge
