version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-gateway
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - CORE_DB_URL=${CORE_DB_URL}
      - ORDERS_DB_URL=${ORDERS_DB_URL}
      # As variáveis de ambiente podem ser passadas aqui ou no painel do Dokploy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - weats-network

  webhooks:
    build:
      context: .
      dockerfile: Dockerfile.webhooks
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-webhooks
    restart: always
    environment:
      - NODE_ENV=production
      - CORE_DB_URL=${CORE_DB_URL}
      - ORDERS_DB_URL=${ORDERS_DB_URL}
    networks:
      - weats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dashboard
    restart: always
    environment:
      - NODE_ENV=production
      - CORE_DB_URL=${CORE_DB_URL}
      - ORDERS_DB_URL=${ORDERS_DB_URL}
    networks:
      - weats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  weats-network:
    driver: bridge