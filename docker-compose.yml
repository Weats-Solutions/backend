version: '3.9'

services:
  gateway:
    image: gateway:latest  # Nome da imagem para o Dokploy associar o build
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "4000:4000"
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - weats-network

  webhooks:
    image: webhooks:latest
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    deploy:
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - weats-network

  dashboard:
    image: dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    deploy:
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - weats-network

networks:
  weats-network:
    driver: overlay # Essencial para Docker Swarm/Stack