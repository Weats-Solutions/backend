user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=200r/s;

    # Upstream Gateway servers (Load Balancing)
    upstream gateway_backend {
        least_conn;  # Load balancing strategy: least connections
        server gateway1:4000 max_fails=3 fail_timeout=30s;
        server gateway2:4000 max_fails=3 fail_timeout=30s;
        server gateway3:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────
    # HTTP Server (redirect to HTTPS)
    # ─────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Let's Encrypt validation (if using Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS (except acme-challenge)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────
    # HTTPS Server (Main API)
    # ─────────────────────────────────────────────────────────────

    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificate Configuration (uncomment when you have certificates)
        # ssl_certificate /etc/nginx/certs/cert.pem;
        # ssl_certificate_key /etc/nginx/certs/key.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Status endpoint (monitoring)
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # ─────────────────────────────────────────────────────────
        # API Routes (v1)
        # ─────────────────────────────────────────────────────────

        location /v1/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─────────────────────────────────────────────────────────
        # Webhooks Routes (Higher rate limit)
        # ─────────────────────────────────────────────────────────

        location /v1/webhooks/ {
            limit_req zone=webhooks burst=200 nodelay;
            
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Important: Don't buffer request body for webhooks
            proxy_request_buffering off;
            
            # Timeouts - webhooks podem ser lentos
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ─────────────────────────────────────────────────────────
        # Admin Panel (Bull Board)
        # ─────────────────────────────────────────────────────────

        location /admin/ {
            limit_req zone=general burst=50 nodelay;
            
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ─────────────────────────────────────────────────────────
        # Root path (health check)
        # ─────────────────────────────────────────────────────────

        location / {
            limit_req zone=general burst=50 nodelay;
            
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ─────────────────────────────────────────────────────────
        # Static Files (if any)
        # ─────────────────────────────────────────────────────────

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─────────────────────────────────────────────────────────
        # Deny access to sensitive files
        # ─────────────────────────────────────────────────────────

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
