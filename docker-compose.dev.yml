version: '3.8'

services:
  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dev-realtime
    restart: always
    ports:
      - '4105:4005'
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    dns:
      - 1.1.1.1
      - 8.8.8.8

  webhooks:
    build:
      context: .
      dockerfile: Dockerfile.webhooks
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dev-webhooks
    restart: always
    ports:
      - '4103:4003'
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dev-dashboard
    restart: always
    ports:
      - '4100:4000'
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
      args:
        CORE_DB_URL: ${CORE_DB_URL}
    container_name: weats-dev-landing
    restart: always
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    ports:
      - '4106:4006'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dev-workers
    restart: always
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.catalog
      args:
        CORE_DB_URL: ${CORE_DB_URL}
        ORDERS_DB_URL: ${ORDERS_DB_URL}
    container_name: weats-dev-catalog
    restart: always
    ports:
      - '4102:4002'
    env_file:
      - .env
    networks:
      - weats-network
      - dokploy-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  weats-network:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network