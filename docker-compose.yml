version: '3.9'

services:
  gateway:
    image: weats-proj-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "4000:4000"
    deploy:
      restart_policy:
        condition: on-failure

  webhooks:
    image: weats-proj-webhooks:latest
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    deploy:
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: weats-proj-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    deploy:
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Removi a seção 'networks' e os 'networks:' em cada serviço.
# O Docker Stack criará uma rede chamada 'default' automaticamente 
# e todos os serviços conseguirão falar entre si pelos nomes (ex: http://gateway:4000)