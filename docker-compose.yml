version: '3.9'

services:
  gateway:
    # Mudamos o nome para algo único do projeto para o Docker local não se perder
    image: weats-proj-gateway:latest 
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "4000:4000"
    deploy:
      restart_policy:
        condition: on-failure
    # Removi o healthcheck temporariamente para garantir que o container sobe
    networks:
      - weats-net

  webhooks:
    image: weats-proj-webhooks:latest
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - weats-net

  dashboard:
    image: weats-proj-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - weats-net

networks:
  weats-net:
    driver: overlay
    # Removida a configuração manual de IP para evitar o erro de "Pool overlaps"